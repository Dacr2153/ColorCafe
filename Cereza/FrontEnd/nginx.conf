# Nginx — sirve la PWA estática + headers de seguridad
# La terminación TLS se hace en el proxy/CDN de borde (Cloudflare, ALB, etc.)

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compresión ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml application/wasm image/svg+xml
        font/ttf font/woff font/woff2;

    # ─── Cabeceras de seguridad ─────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https:;
        font-src 'self' data:;
        connect-src 'self' https: wss:;
        worker-src 'self' blob:;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ─── Assets versionados (Vite) — cache larga e inmutable ────────
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ─── Service worker — NUNCA cachear ─────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ───────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Salud ──────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
